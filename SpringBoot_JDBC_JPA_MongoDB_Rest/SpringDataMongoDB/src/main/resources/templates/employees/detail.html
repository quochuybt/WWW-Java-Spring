<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi Tiết Nhân Viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2>Thông Tin Chi Tiết Nhân Viên</h2>

<div class="card col-md-6" th:if="${employee != null}">
    <div class="card-body">
        <p><strong>ID:</strong> <span th:text="${employee.id}"></span></p>
        <p><strong>Họ và tên:</strong> <span th:text="${employee.name}"></span></p>
        <p><strong>Tuổi:</strong> <span th:text="${employee.age}"></span></p>
        <p><strong>Lương:</strong> <span th:text="${#numbers.formatDecimal(employee.salary, 0, 'COMMA', 2, 'POINT')}"></span></p>
        <p><strong>Phòng ban ID:</strong> <span th:text="${employee.departmentId != null ? employee.departmentId : 'Chưa phân'}"></span></p>
        <p><strong>Chức vụ ID:</strong> <span th:text="${employee.positionId != null ? employee.positionId : 'Chưa phân'}"></span></p>
    </div>
</div>

<div th:if="${employee == null}" class="alert alert-danger">
    Không tìm thấy nhân viên!
</div>

<a href="/employees" class="btn btn-secondary mt-3">Quay lại danh sách</a>
</body>
</html>
