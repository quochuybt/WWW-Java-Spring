<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tìm Kiếm Nhân Viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2>Tìm Kiếm Nhân Viên</h2>

<form th:action="@{/employees/search}" th:object="${criteria}" method="get" class="row g-3 mb-4">
    <div class="col-md-3">
        <input type="text" th:field="*{name}" class="form-control" placeholder="Tên nhân viên..." />
    </div>
    <div class="col-md-2">
        <input type="number" th:field="*{minSalary}" class="form-control" placeholder="Lương tối thiểu..." />
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-primary">Tìm kiếm</button>
        <a href="/employees" class="btn btn-secondary">Quay lại</a>
    </div>
</form>

<div th:if="${employees != null}">
    <h4>Kết quả tìm kiếm:</h4>
    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Tên</th>
            <th>Tuổi</th>
            <th>Lương</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}"></td>
            <td th:text="${emp.name}"></td>
            <td th:text="${emp.age}"></td>
            <td th:text="${emp.salary}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
