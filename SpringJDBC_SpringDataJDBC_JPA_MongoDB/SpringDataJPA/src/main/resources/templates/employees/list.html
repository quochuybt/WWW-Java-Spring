<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Nhân Viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<!-- Thanh thông tin đăng nhập Header -->
<div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-light rounded">
    <h2>Quản Lý Nhân Viên (Spring JDBC + Security)</h2>
    <div sec:authorize="isAuthenticated()">
        Xin chào, <b sec:authentication="name"></b>
        (<span sec:authentication="principal.authorities"></span>)
        <form th:action="@{/logout}" method="post" class="d-inline ms-2">
            <button type="submit" class="btn btn-outline-danger btn-sm">Đăng xuất</button>
        </form>
    </div>
</div>

<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

<!-- Nút Thêm mới: Chỉ hiển thị với USER và ADMIN -->
<a sec:authorize="hasAnyRole('USER', 'ADMIN')" href="/employees/new" class="btn btn-primary mb-3">Thêm Nhân Viên Mới</a>
<a href="/employees/search" class="btn btn-secondary mb-3 ms-2">Tìm Kiếm</a>

<table class="table table-bordered align-middle">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Họ Và Tên</th>
        <th>Tuổi</th>
        <th>Lương</th>
        <th>Phòng Ban ID</th>
        <th>Chức Vụ ID</th>
        <th>Thao Tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="emp : ${employees}">
        <td th:text="${emp.id}"></td>
        <td th:text="${emp.name}"></td>
        <td th:text="${emp.age}"></td>
        <td th:text="${#numbers.formatDecimal(emp.salary, 0, 'COMMA', 2, 'POINT')}"></td>
        <td th:text="${emp.department != null ? emp.department.name : 'Chưa phân'}"></td>
        <td th:text="${emp.position != null ? emp.position.name : 'Chưa phân'}"></td>
        <td>
            <!-- Ai cũng xem được -->
            <a th:href="@{/employees/{id}(id=${emp.id})}" class="btn btn-info btn-sm">Xem</a>

            <!-- Sửa: Chỉ USER và ADMIN -->
            <a sec:authorize="hasAnyRole('USER', 'ADMIN')"
               th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-warning btn-sm">Sửa</a>

            <!-- Xóa: Chỉ ADMIN -->
            <form sec:authorize="hasRole('ADMIN')"
                  th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
